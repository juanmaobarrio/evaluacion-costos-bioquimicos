version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biocostos_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Ruta absoluta dentro del volumen de datos (4 barras = path absoluto en SQLite)
      - DATABASE_URL=sqlite+aiosqlite:////app/data/costos_bioquimica.db
      - SECRET_KEY=super_secret_costos_bioquimica_key_change_in_production_2025
      - USD_EXCHANGE_RATE=1200.0
    volumes:
      # IMPORTANTE: el volumen se monta SOLO en /app/data, nunca en /app.
      # Si se monta en /app, el volumen tapa el codigo de la imagen y los
      # rebuilds no se aplican (el backend sigue corriendo codigo viejo).
      # El mismo volumen 'backend_data' se reutiliza: la DB que estaba en la
      # raiz del volumen queda ahora en /app/data/costos_bioquimica.db.
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biocostos_frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  backend_data:
